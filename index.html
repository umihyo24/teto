<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Void Blocks — a falling-block puzzle where empty cells have no collision.">
    <title>Void Blocks</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="game-shell" aria-labelledby="page-title">
      <header class="brand">
        <p class="eyebrow">A COLLISION-BENDING PUZZLE</p>
        <h1 id="page-title">VOID <span>BLOCKS</span></h1>
      </header>
      <canvas id="game" width="650" height="680" aria-label="Void Blocks game canvas">
        Your browser needs Canvas support to play Void Blocks.
      </canvas>
      <p class="keyboard-note">Keyboard required · Void spaces are truly intangible</p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
